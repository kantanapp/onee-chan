<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3f8f2">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>おはなしの ほんだな</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@500&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
/* Layout: the picture fills the whole screen; a soft text card floats at the bottom and can be hidden */
:root{
  --paper:#f3f8f2;
  --card:rgba(255,255,255,.86);
  --solid:#ffffff;
  --ink:#3a2f2a;
  --soft:#7a6c64;
  --tomato:#e2483d;
  --leaf:#4f9a5a;
  --line:#dde7dc;
  --shade:rgba(58,47,42,.18);
  --chip:rgba(255,255,255,.78);
  --display:"Kiwi Maru","Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif;
  --body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
  /* the story card keeps these cream tones in dark mode too, so the words stay easy to read */
  --textcard:rgba(252,246,234,.93);
  --textink:#3a2f2a;
  --texttitle:#d93e33;
  --texthint:#8a7b70;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#1d2420;--card:rgba(32,38,34,.86);--solid:#28302b;--ink:#f3ece6;--soft:#b8aca4;--tomato:#ff6b5e;--leaf:#7cc488;--line:#38423b;--shade:rgba(0,0,0,.4);--chip:rgba(32,38,34,.75);color-scheme:dark}}
:root[data-theme="dark"]{--paper:#1d2420;--card:rgba(32,38,34,.86);--solid:#28302b;--ink:#f3ece6;--soft:#b8aca4;--tomato:#ff6b5e;--leaf:#7cc488;--line:#38423b;--shade:rgba(0,0,0,.4);--chip:rgba(32,38,34,.75);color-scheme:dark}

html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit}

.app{position:relative;height:100%;max-width:620px;margin:0 auto;overflow:hidden;background:var(--paper)}
.stage{position:absolute;inset:0;cursor:grab;outline:none;touch-action:pan-y;overflow:hidden}
/* both pages ride on one track: the page we are heading to is already parked just off the
   edge, so the picture follows the finger at once and no blank gap or tilt shows while turning */
.track{position:absolute;inset:0;will-change:transform}
.track.anim{transition:transform .22s cubic-bezier(.22,.61,.36,1)}
.page{position:absolute;inset:0;background:var(--paper)}
.stage:focus-visible{outline:3px solid var(--leaf);outline-offset:-3px}
.frame{position:absolute;inset:0}
.frame img{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
.frame img.bg{object-fit:cover;filter:blur(22px) saturate(1.1);transform:scale(1.15);opacity:.9}
.frame img.main{object-fit:contain;object-position:50% 30%}
.ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:repeating-linear-gradient(45deg,var(--paper) 0 16px,var(--solid) 16px 32px);color:var(--soft);text-align:center;padding:16px 16px 40%}
.ph b{font-family:var(--display);font-size:1.4rem;color:var(--ink)}
.ph small{font-size:.9rem;line-height:1.6}

/* top controls float over the picture */
.bar{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:8px;padding:10px 16px;z-index:2;pointer-events:none}
.bar > *{pointer-events:auto}
.bar .grow{flex:1;min-width:0;display:flex;justify-content:center;align-items:center;gap:clamp(4px,1.3vw,6px);overflow:hidden;pointer-events:none}
.dot{width:clamp(7px,2vw,9px);height:clamp(7px,2vw,9px);flex:none;border-radius:50%;background:var(--chip);box-shadow:0 1px 3px var(--shade);transition:background .3s,transform .3s}
.dot.on{background:var(--tomato);transform:scale(1.25)}
.icon{width:clamp(37px,10.5vw,42px);height:clamp(37px,10.5vw,42px);flex:none;border-radius:50%;border:none;background:var(--chip);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);box-shadow:0 2px 6px var(--shade);display:grid;place-items:center;cursor:pointer}
.icon svg{width:21px;height:21px;stroke:var(--ink);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.icon[aria-pressed="false"] svg{opacity:.45}
.icon:disabled{opacity:.3}
.icon:focus-visible,.big:focus-visible{outline:3px solid var(--leaf);outline-offset:2px}

/* story text card at the bottom */
.text{position:absolute;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:2;background:var(--textcard);color:var(--textink);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:20px;padding:14px 18px;box-shadow:0 4px 16px var(--shade);font-size:clamp(1.15rem,5vw,1.5rem);line-height:1.7;letter-spacing:.02em;transition:opacity .3s,transform .3s}
/* lines reach both edges of the card; kinsoku keeps small kana off the start of a line */
.text p{margin:0;text-align:justify;line-break:strict;text-wrap:pretty;overflow-wrap:break-word}
/* story cards are all the same height (4 lines) so the box does not jump while turning pages */
.text:not(.title){min-height:calc(6.8em + 28px);display:flex;flex-direction:column;justify-content:center}
.text.title{text-align:center;font-family:var(--display);font-size:clamp(1.6rem,7.5vw,2.2rem);color:var(--texttitle);line-height:1.4}
.text.off{opacity:0;transform:translateY(20px);pointer-events:none}
.hint{display:block;text-align:center;color:var(--texthint);font-size:clamp(1.05rem,4.4vw,1.3rem);margin-top:6px;letter-spacing:0}
.fade{animation:fade .45s ease}
@keyframes fade{from{opacity:.3;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}.dot,.text{transition:none}}

.end{display:flex;justify-content:center}

/* bookshelf: pick a story */
.shelf{position:fixed;inset:0;z-index:4;overflow:auto;background:var(--paper);-webkit-overflow-scrolling:touch}
.shelfin{max-width:620px;margin:0 auto;padding:22px 16px calc(28px + env(safe-area-inset-bottom,0px))}
.shelfin h1{font-family:var(--display);font-size:clamp(1.35rem,5.8vw,1.8rem);color:var(--tomato);text-align:center;margin:6px 0 20px;line-height:1.4}
.books{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px}
.book{border:none;background:none;padding:0;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:8px;font:inherit;color:inherit}
.book img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:14px;box-shadow:0 3px 10px var(--shade);display:block;background:var(--solid)}
.book b{font-family:var(--display);font-size:1.05rem;line-height:1.4}
.book small{color:var(--soft);font-size:.82rem;line-height:1.5}
.book:focus-visible img{outline:3px solid var(--leaf);outline-offset:3px}
.big{border:none;border-radius:999px;padding:12px 22px;font-family:var(--display);font-size:1.15rem;cursor:pointer;background:var(--tomato);color:#fff;box-shadow:0 3px 8px var(--shade)}
.big.sub{background:var(--solid);color:var(--ink)}

/* settings sheet */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:5}
.panel{background:var(--paper);width:100%;max-width:620px;max-height:88%;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));box-sizing:border-box}
.panel h2{font-family:var(--display);margin:0 0 4px;font-size:1.3rem}
.panel p{margin:0 0 12px;color:var(--soft);font-size:.92rem;line-height:1.6}
.slots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
.slot{border:2px dashed var(--line);border-radius:12px;aspect-ratio:3/4;background:var(--solid) center/cover no-repeat;display:flex;align-items:flex-end;justify-content:center;cursor:pointer;padding:0;overflow:hidden}
.slot span{background:var(--solid);font-size:.75rem;padding:2px 6px;border-radius:8px 8px 0 0}
.slot.has{border-style:solid;border-color:var(--leaf)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.row label{font-size:.95rem}
.row input[type=range]{flex:1;min-width:140px;accent-color:var(--tomato)}
</style>
</head>
<body>
<div class="shelf" id="shelf">
  <div class="shelfin">
    <h1>どの おはなしを よむ？</h1>
    <div class="books" id="books"></div>
  </div>
</div>

<div class="app" id="app" hidden>
  <div class="stage" id="stage" tabindex="0" aria-live="polite">
    <div class="track" id="track">
      <div class="page" id="pg"></div>
      <div class="page" id="pg2" aria-hidden="true" hidden></div>
    </div>
  </div>
  <div class="bar">
    <button class="icon" id="back" aria-label="まえの ページ"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button class="icon" id="home" aria-label="ほんだなへ もどる"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7"/><path d="M6 10v9h12v-9"/><path d="M10 19v-5h4v5"/></svg></button>
    <div class="grow" id="dots"></div>
    <button class="icon" id="textBtn" aria-label="もじを だす・かくす" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M5 6h14M12 6v13M8 19h8"/></svg></button>
    <button class="icon" id="sound" aria-label="よみあげ オン・オフ" aria-pressed="true"><svg viewBox="0 0 24 24" id="soundIcon"></svg></button>
    <button class="icon" id="gear" aria-label="えを いれる・せってい"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-8 8"/></svg></button>
  </div>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="panel">
    <h2>えを かえる</h2>
    <p>えは さいしょから はいっています。べつの えに かえたい ときは わくを タップ。<br>「まとめて えらぶ」は ファイルめいの じゅんばん（0=ひょうし、1、2…）に ならびます。「もとに もどす」で さいしょの えに もどります。</p>
    <div class="slots" id="slots"></div>
    <div class="row">
      <button class="big" id="pickAll">まとめて えらぶ</button>
      <button class="big sub" id="clearAll">もとに もどす</button>
    </div>
    <div class="row">
      <label for="rate">よむ はやさ</label>
      <input type="range" id="rate" min="0.6" max="1.2" step="0.05" value="0.85">
    </div>
    <div class="row">
      <button class="big sub" id="testVoice">こえを ためす</button>
      <button class="big" id="closeSheet">とじる</button>
    </div>
    <input type="file" id="fileAll" accept="image/*" multiple hidden>
    <input type="file" id="fileOne" accept="image/*" hidden>
  </div>
</div>

<!-- bump this date whenever works.js changes, or phones keep showing the old text for up to 10 minutes -->
<script src="works.js?v=20261013"></script>
<script>
const $ = id => document.getElementById(id);
// the story being read now; the shelf is shown while it is null
let work = null, PAGES = [], BUILTIN = [];
let page = 0, soundOn = true, textOn = true, rate = 0.85, urls = [], ended = false;

/* ---- storage (optional; the page works without it) ---- */
let db = null;
function openDB(){ return new Promise(res=>{ try{
  const r = indexedDB.open("kamishibai-tomato",1);
  r.onupgradeneeded = ()=> r.result.createObjectStore("img");
  r.onsuccess = ()=> res(r.result); r.onerror = ()=> res(null);
}catch(e){res(null)} }); }
// keys are "<work id>:<page>" so each story keeps its own replaced pictures
const dbKey = i => work.id+":"+i;
function dbPut(k,v){ try{ if(!db) return; const t=db.transaction("img","readwrite"); v?t.objectStore("img").put(v,dbKey(k)):t.objectStore("img").delete(dbKey(k));}catch(e){} }
function dbGetAll(){ return new Promise(res=>{ try{ if(!db) return res();
  const s=db.transaction("img","readonly").objectStore("img"); let n=0;
  PAGES.forEach((_,i)=>{ const q=s.get(dbKey(i)); q.onsuccess=()=>{ if(q.result) setImg(i,q.result,false); if(++n===PAGES.length) res(); }; q.onerror=()=>{ if(++n===PAGES.length) res(); }; });
}catch(e){res()} }); }
function setImg(i,blob,save=true){
  if(urls[i]) URL.revokeObjectURL(urls[i]);
  urls[i]= blob? URL.createObjectURL(blob): null;
  if(save) dbPut(i,blob);
}
try{ const s=localStorage.getItem("ks-rate"); if(s) rate=+s;
     const m=localStorage.getItem("ks-sound"); if(m!==null) soundOn = m==="1";
     const t=localStorage.getItem("ks-text"); if(t!==null) textOn = t==="1"; }catch(e){}

/* ---- speech ---- */
const synth = window.speechSynthesis;
let voice = null;
function pickVoice(){ if(!synth) return; const vs = synth.getVoices().filter(v=>/ja/i.test(v.lang));
  voice = vs.find(v=>/Kyoko|O-ren|Nanami|Google 日本語|Haruka|Ayumi/i.test(v.name)) || vs[0] || null; }
if(synth){ pickVoice(); synth.onvoiceschanged = pickVoice; }
function speak(t, force){
  if(!synth) return; synth.cancel(); if(!soundOn && !force) return;
  const u = new SpeechSynthesisUtterance(t); u.lang="ja-JP"; u.rate=rate; u.pitch=1.1; if(voice) u.voice=voice;
  synth.speak(u);
}

/* ---- bookshelf ---- */
function renderShelf(){
  $("books").innerHTML = WORKS.map(w=>
    `<button class="book" data-id="${w.id}"><img src="works/${w.id}/img/0.jpg" alt="" draggable="false"><b>${w.title}</b><small>${w.lead||""}</small></button>`).join("");
  $("books").querySelectorAll(".book").forEach(b=> b.onclick=()=> openWork(b.dataset.id));
}
function openWork(id){
  const w = WORKS.find(x=>x.id===id);
  if(!w){ closeWork(); return; }
  urls.forEach(u=> u && URL.revokeObjectURL(u));
  work=w; PAGES=w.pages; urls=[]; page=0; ended=false;
  BUILTIN = PAGES.map((_,i)=>`works/${w.id}/img/${i}.jpg`);
  BUILTIN.forEach(src=>{ const im=new Image(); im.src=src; });
  document.title = w.title;
  $("shelf").hidden=true; $("app").hidden=false;
  resetSlide();
  render();
  if(db) dbGetAll().then(render);
  if(decodeURIComponent(location.hash.slice(1))!==id) location.hash = id;
}
function closeWork(){
  if(synth) synth.cancel();
  resetSlide();
  work=null; PAGES=[]; BUILTIN=[];
  document.title = "おはなしの ほんだな";
  $("app").hidden=true; $("shelf").hidden=false;
  if(location.hash && location.hash!=="#") location.hash="";
}
function route(){
  const id = decodeURIComponent(location.hash.slice(1));
  if(id && WORKS.some(w=>w.id===id)){ if(!work || work.id!==id) openWork(id); }
  else if(work) closeWork();
}

/* ---- render ---- */
// paint one page (picture + text card) into el; `live` gives it the ids the rest of the app uses
function paint(el, st, live){
  const imgIndex = st.ended ? 0 : st.page;
  const src = urls[imgIndex] || BUILTIN[imgIndex];
  const fr = document.createElement("div"); fr.className="frame"; if(live) fr.id="frame";
  if(src){
    const bg=new Image(); bg.src=src; bg.alt=""; bg.className="bg"; bg.draggable=false;
    const im=new Image(); im.src=src; im.alt=PAGES[imgIndex].note; im.className="main"; im.draggable=false;
    fr.append(bg, im);
  }
  else fr.innerHTML = `<div class="ph"><svg width="72" height="72" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="36" r="22" fill="var(--tomato)"/><path d="M32 16c-6-6-12-4-14-2 6 0 9 3 14 6 5-3 8-6 14-6-2-2-8-4-14 2z" fill="var(--leaf)"/></svg><b>${imgIndex===0?"ひょうし":imgIndex+"まいめ"}の え</b><small>${PAGES[imgIndex].note}<br>みぎうえの えの ボタンから いれてね</small></div>`;

  const tx = document.createElement("div"); if(live) tx.id="text";
  if(st.ended){
    tx.className = "text title";
    tx.innerHTML = `<p>おしまい</p><div class="end" style="margin-top:8px"><button class="big again">もういちど よむ</button></div>`;
  } else {
    const p = PAGES[st.page];
    tx.className = "text"+(p.title?" title":"")+(textOn?"":" off");
    const hint = st.page===0 ? "タップか ゆびで めくってね" : "";
    // the cover picture already carries the title, so its card only shows the hint
    tx.innerHTML = (st.page===0?"":`<p>${p.text}</p>`)+(hint?`<span class="hint">${hint}</span>`:"");
  }
  el.replaceChildren(fr, tx);
}
function render(){
  if(!work) return;
  paint(pg, {page, ended}, true);
  $("dots").innerHTML = PAGES.map((_,i)=>`<span class="dot${i===page?" on":""}"></span>`).join("");
  $("back").disabled = page===0 && !ended;
  $("textBtn").setAttribute("aria-pressed", textOn);
  $("sound").setAttribute("aria-pressed", soundOn);
}
/* ---- page turning: slide with the finger, or tap to go on ---- */
const pg = $("pg"), pg2 = $("pg2"), track = $("track"), stage = $("stage");
// the last page depends on the story being read, so work it out each time
const last = ()=> PAGES.length-1;
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const SLIDE = 220;                       // ms the page takes to finish sliding on its own
let sx=0, dx=0, t0=0, timer=0, dragging=false, staged=0, busy=false;
const canNext = ()=> !ended;
const canPrev = ()=> ended || page>0;
// where dir would take us, without changing anything yet
const after = dir => dir>0
  ? (page<last() ? {page:page+1, ended:false} : {page, ended:true})
  : (ended ? {page, ended:false} : {page:page-1, ended:false});

// park the page we are heading to just off the edge, so it slides in together with this one
function stageNext(dir){
  if(staged===dir) return;
  staged = dir;
  if(!dir){ pg2.hidden=true; pg2.replaceChildren(); return; }
  paint(pg2, after(dir), false);
  pg2.style.transform = `translateX(${dir>0?100:-100}%)`;
  pg2.hidden = false;
}
function applyTurn(dir){
  // change state and start the voice right away (inside the finger gesture)
  if(dir>0){ if(page<last()){ page++; speak(PAGES[page].say); } else { ended=true; speak("おしまい。"); } }
  else { if(ended){ ended=false; speak(PAGES[page].say); } else { page--; speak(PAGES[page].say); } }
}
// the slide is over: the new page becomes the live one and the track goes back to zero
function settle(){
  render();
  stageNext(0);
  track.classList.remove("anim");
  track.style.transform = "";
  busy=false;
}
function turn(dir){
  if(busy) return;
  if(dir>0 ? !canNext() : !canPrev()){ snapBack(); return; }
  stageNext(dir);
  applyTurn(dir);
  if(reduce){ settle(); return; }
  busy=true;
  void track.offsetWidth;                // let the parked page land before the slide starts
  track.classList.add("anim");
  track.style.transform = `translateX(${-dir*stage.clientWidth}px)`;
  clearTimeout(timer); timer = setTimeout(settle, SLIDE+30);
}
function snapBack(){
  if(busy) return;
  busy=true;
  track.classList.add("anim");
  track.style.transform = "";
  clearTimeout(timer);
  timer = setTimeout(()=>{ track.classList.remove("anim"); stageNext(0); busy=false; }, SLIDE+30);
}
// leaving the story mid-turn must not leave the track parked off screen
function resetSlide(){
  clearTimeout(timer); dragging=false; busy=false; dx=0;
  track.classList.remove("anim"); track.style.transform=""; stageNext(0);
}

stage.addEventListener("pointerdown", e=>{
  if(busy || e.target.closest("button")) return;
  dragging=true; sx=e.clientX; dx=0; t0=Date.now(); track.classList.remove("anim");
  try{ stage.setPointerCapture(e.pointerId); }catch(err){}
});
stage.addEventListener("pointermove", e=>{
  if(!dragging) return;
  dx = e.clientX - sx;
  const dir = dx<0 ? 1 : dx>0 ? -1 : 0;
  const open = dir>0 ? canNext() : dir<0 ? canPrev() : false;
  if(dir && !open) dx *= 0.25;           // resist at the ends
  stageNext(open ? dir : 0);
  track.style.transform = `translateX(${dx}px)`;
});
function endDrag(){
  if(!dragging) return; dragging=false;
  const th = Math.min(80, stage.clientWidth*0.18);
  if(dx < -th) turn(1);
  else if(dx > th) turn(-1);
  else if(Math.abs(dx) < 16 && Date.now()-t0 < 500) turn(1);   // a tap goes on to the next page (fingers wobble a little)
  else snapBack();
}
stage.addEventListener("pointerup", endDrag);
// a cancelled gesture is not a tap, so it only slides back
stage.addEventListener("pointercancel", ()=>{ if(!dragging) return; dragging=false; snapBack(); });
stage.addEventListener("keydown", e=>{ if(e.key==="ArrowRight"||e.key===" "||e.key==="Enter"){ e.preventDefault(); turn(1); } if(e.key==="ArrowLeft") turn(-1); });
// "もういちど よむ" lives inside the page, which is repainted on every turn
stage.addEventListener("click", e=>{ if(!e.target.closest(".again")) return;
  ended=false; page=0; render(); speak(PAGES[0].say); });
$("back").onclick = ()=> turn(-1);
$("home").onclick = ()=> closeWork();

function soundIcon(){ $("soundIcon").innerHTML = soundOn
  ? '<path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9a4 4 0 0 1 0 6"/><path d="M18.5 6.5a8 8 0 0 1 0 11"/>'
  : '<path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9l5 6M22 9l-5 6"/>'; }
$("sound").onclick = ()=>{ soundOn=!soundOn; soundIcon(); try{localStorage.setItem("ks-sound",soundOn?"1":"0")}catch(e){}
  $("sound").setAttribute("aria-pressed", soundOn);
  if(soundOn && !ended) speak(PAGES[page].say); else if(synth) synth.cancel(); };
$("textBtn").onclick = ()=>{ textOn=!textOn; try{localStorage.setItem("ks-text",textOn?"1":"0")}catch(e){}
  $("textBtn").setAttribute("aria-pressed", textOn);
  if(!ended) $("text").classList.toggle("off", !textOn); };

/* ---- settings sheet ---- */
let oneTarget = 0;
function renderSlots(){
  $("slots").innerHTML = PAGES.map((_,i)=>{ const s=urls[i]||BUILTIN[i]; return `<button class="slot${s?" has":""}" data-i="${i}" style="${s?`background-image:url(${s})`:""}"><span>${i===0?"ひょうし":i}</span></button>`; }).join("");
  $("slots").querySelectorAll(".slot").forEach(b=> b.onclick=()=>{ oneTarget=+b.dataset.i; $("fileOne").click(); });
}
$("gear").onclick = ()=>{ if(synth) synth.cancel(); renderSlots(); $("rate").value=rate; $("sheet").hidden=false; };
function closeSheet(){ $("sheet").hidden=true; render(); }
$("closeSheet").onclick = closeSheet;
$("sheet").onclick = e=>{ if(e.target.id==="sheet") closeSheet(); };
$("pickAll").onclick = ()=> $("fileAll").click();
$("fileAll").onchange = e=>{
  const fs=[...e.target.files].sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}));
  fs.slice(0,PAGES.length).forEach((f,i)=>setImg(i,f)); e.target.value=""; renderSlots();
};
$("fileOne").onchange = e=>{ const f=e.target.files[0]; if(f) setImg(oneTarget,f); e.target.value=""; renderSlots(); };
$("clearAll").onclick = ()=>{ PAGES.forEach((_,i)=>setImg(i,null)); renderSlots(); };
$("rate").oninput = e=>{ rate=+e.target.value; try{localStorage.setItem("ks-rate",rate)}catch(err){} };
$("testVoice").onclick = ()=> speak("すみれちゃんは、トマトが、だいきらい。", true);

soundIcon(); renderShelf();
openDB().then(d=>{ db=d; if(work) return dbGetAll().then(render); });
addEventListener("hashchange", route);
route();
</script>
</body>
</html>
